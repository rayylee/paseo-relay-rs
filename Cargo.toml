[package]
name = "paseo-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-node, protocol-compatible WebSocket relay for Paseo."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
base64 = "0.23"
rand = "0.10"
futures-util = "0.3"
form_urlencoded = "1"
socket2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"

[profile.release]
lto = "thin"
